  dev-certs: {}
  # shared engine infrastructure
  engine-opensearch-data: {}
  engine-valkey-data: {}
  engine-rabbitmq-data: {}
  engine-s3-data: {}
  engine-mariadb-data: {}
  engine-postgres-data: {}
  # endpoint
  wazuh-certs: {}
  wazuh-indexer-data: {}
  wazuh-api-config: {}
  wazuh-etc: {}
  wazuh-logs: {}
  wazuh-queue: {}
  wazuh-multigroups: {}
  wazuh-integrations: {}
  wazuh-active-response: {}
  wazuh-filebeat-etc: {}
  wazuh-filebeat-var: {}
  velociraptor-data: {}
  osquery-db: {}
  osquery-logs: {}
  # network
  suricata-logs: {}
  suricata-rules: {}
  zeek-logs: {}
  arkime-pcap: {}
  arkime-pcap-drop: {}
  # search / streaming / collection
  opensearch-data: {}
  kafka-data: {}
  vector-data: {}
  otelcol-data: {}
  # intel / case / soar
  misp-config: {}
  misp-files: {}
  misp-logs: {}
  misp-gnupg: {}
  misp-ssl: {}
  iris-db-data: {}
  iris-downloads: {}
  iris-user-templates: {}
  iris-server-data: {}
  shuffle-apps: {}
  shuffle-files: {}
  # vuln (Greenbone)
  gvm-vt-data: {}
  gvm-notus-data: {}
  gvm-scap-data: {}
  gvm-cert-data: {}
  gvm-data-objects: {}
  gvm-gpg-data: {}
  gvm-redis-socket: {}
  gvm-psql-data: {}
  gvm-psql-socket: {}
  gvmd-data: {}
  gvmd-socket: {}
  gvm-ospd-socket: {}
  gvm-openvas-data: {}
  gvm-openvas-logs: {}
  # asm / cloud / deception / forensics / copilot
  nuclei-results: {}
  nuclei-templates: {}
