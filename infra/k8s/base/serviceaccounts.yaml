#
# One identity per workload. None of them talks to the Kubernetes API, so tokens are not mounted;
# annotate with the cloud workload-identity role (IRSA / Workload Identity) in the overlay when the
# API needs KMS or object storage.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bloody-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bloody-scheduler
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bloody-migrate
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bloody-web
automountServiceAccountToken: false
