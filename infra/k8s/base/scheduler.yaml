#
# Scheduler: the same API image with BLOODY_SCHEDULER_ENABLED=true (scheduled reports, automation
# rules, SLA/escalation timers, intel feed syncs). Exactly one replica (Recreate strategy) so
# schedules fire once; the scheduler additionally holds a Postgres advisory lock per job run, so a
# brief overlap during a node failure cannot double-fire. Not behind a Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bloody-scheduler
  labels:
    app.kubernetes.io/name: bloody
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: bloody
      app.kubernetes.io/component: scheduler
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bloody
        app.kubernetes.io/component: scheduler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /api/v1/metrics
    spec:
      serviceAccountName: bloody-scheduler
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: bloody/api
          imagePullPolicy: IfNotPresent
          args: ["dist/server.js"]
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bloody-config
          env:
            - name: BLOODY_SCHEDULER_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: bloody-scheduler
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: DATABASE_URL } }
            - name: VALKEY_URL
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: VALKEY_URL } }
            - name: BLOODY_JWT_SECRET
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: BLOODY_JWT_SECRET } }
            - name: BLOODY_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: BLOODY_ENCRYPTION_KEY } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: SMTP_USER } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: SMTP_PASSWORD } }
            - name: NODE_OPTIONS
              value: "--enable-source-maps --max-old-space-size=768"
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet: { path: /api/v1/healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            # Report rendering (PDF) spills here.
            sizeLimit: 1Gi
