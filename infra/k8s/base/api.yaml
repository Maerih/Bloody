#
# Control-plane API (apps/api): stateless, horizontally scaled, non-root, read-only root FS,
# no capabilities, no service-account token. Health: /api/v1/healthz (liveness),
# /api/v1/readyz (readiness: DB + migrations), metrics: /api/v1/metrics (Prometheus).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bloody-api
  labels:
    app.kubernetes.io/name: bloody
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: bloody
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bloody
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /api/v1/metrics
    spec:
      serviceAccountName: bloody-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bloody
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: bloody
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: bloody/api
          imagePullPolicy: IfNotPresent
          args: ["dist/server.js"]
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bloody-config
          env:
            # Scheduled reports / automations run in the single-replica bloody-scheduler.
            - name: BLOODY_SCHEDULER_ENABLED
              value: "false"
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: DATABASE_URL } }
            - name: VALKEY_URL
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: VALKEY_URL } }
            - name: BLOODY_JWT_SECRET
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: BLOODY_JWT_SECRET } }
            - name: BLOODY_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: BLOODY_ENCRYPTION_KEY } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: SMTP_USER } }
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: SMTP_PASSWORD } }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: OIDC_CLIENT_SECRET, optional: true } }
            - name: NODE_OPTIONS
              value: "--enable-source-maps --max-old-space-size=768"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet: { path: /api/v1/healthz, port: http }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: { path: /api/v1/healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/v1/readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            # Let the ingress drain this endpoint before SIGTERM (distroless: no shell for `sleep`;
            # the native sleep action needs Kubernetes >= 1.30).
            preStop:
              sleep:
                seconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: bloody-api
  labels:
    app.kubernetes.io/name: bloody
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bloody
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bloody-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bloody-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Percent, value: 100, periodSeconds: 60 }
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 25, periodSeconds: 120 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bloody-api
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: bloody
      app.kubernetes.io/component: api
