#
# Schema migrations, run before every rollout as the schema-owner role (the API's runtime role
# cannot run DDL). Migrations are forward-only, transactional and expand/contract-compatible with
# the previous release (docs/OPERATIONS.md §Upgrades), so a failed rollout can roll back the
# Deployment without touching the schema.
# Argo CD runs it as a PreSync hook; with plain kubectl: `kubectl -n bloody replace --force -f`.
apiVersion: batch/v1
kind: Job
metadata:
  name: bloody-migrate
  labels:
    app.kubernetes.io/name: bloody
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bloody
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: bloody-migrate
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: bloody/api
          imagePullPolicy: IfNotPresent
          args: ["dist/db/migrate.js"]
          env:
            - name: NODE_ENV
              value: production
            - name: MIGRATIONS_DIR
              value: /app/apps/api/migrations
            # The runner's privileged connection is the schema owner, never a superuser.
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: DATABASE_MIGRATION_URL } }
            - name: BLOODY_APP_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: BLOODY_APP_DB_PASSWORD } }
            # migrate.js loads the full API config, which in production requires these two.
            - name: BLOODY_JWT_SECRET
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: BLOODY_JWT_SECRET } }
            - name: BLOODY_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: bloody-secrets, key: BLOODY_ENCRYPTION_KEY } }
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
