#
# Placeholder mapping from the organisation's secret manager (Vault, AWS/GCP/Azure secret
# managers…) to the `bloody-secrets` Secret, via the External Secrets Operator. No secret value is
# ever committed to this repository. Remote keys are placeholders — align them with your store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bloody-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bloody-secret-store
  target:
    name: bloody-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Runtime role (DML only, RLS enforced) — used by the API and scheduler.
    - secretKey: DATABASE_URL
      remoteRef: { key: bloody/control-plane, property: database_url }
    # Schema owner — used ONLY by the migration Job.
    - secretKey: DATABASE_MIGRATION_URL
      remoteRef: { key: bloody/control-plane, property: database_migration_url }
    - secretKey: VALKEY_URL
      remoteRef: { key: bloody/control-plane, property: valkey_url }
    - secretKey: BLOODY_JWT_SECRET
      remoteRef: { key: bloody/control-plane, property: jwt_secret }
    # 32-byte AES-256-GCM key (base64) for credentialRef secrets; prefer a KMS-wrapped key.
    - secretKey: BLOODY_ENCRYPTION_KEY
      remoteRef: { key: bloody/control-plane, property: encryption_key }
    - secretKey: SMTP_USER
      remoteRef: { key: bloody/smtp, property: username }
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: bloody/smtp, property: password }
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: { key: bloody/oidc, property: client_secret }
