  "http.port": 80,
  "http.banner": "Apache/2.4.58 (Ubuntu)",
  "http.skin": "nasLogin",
  "https.enabled": false,
  "ssh.enabled": true,
  "ssh.port": 22,
  "ssh.version": "SSH-2.0-OpenSSH_9.6p1 Ubuntu-3ubuntu13",
  "telnet.enabled": true,
  "telnet.port": 23,
  "telnet.banner": "",
  "mysql.enabled": true,
  "mysql.port": 3306,
  "mysql.banner": "5.7.44-log",
  "redis.enabled": true,
  "redis.port": 6379,
  "rdp.enabled": false,
  "smb.enabled": false,
  "snmp.enabled": false,
  "sip.enabled": false,
  "vnc.enabled": false,
  "mssql.enabled": false,
  "ntp.enabled": false,
