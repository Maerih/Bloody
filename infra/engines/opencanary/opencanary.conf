{
  "device.node_id": "bloody-dev-canary-01",
  "ip.ignorelist": [],
  "logtype.ignorelist": [],
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": { "format": "%(message)s" }
      },
      "handlers": {
        "console": { "class": "logging.StreamHandler", "stream": "ext://sys.stdout" },
        "file": { "class": "logging.FileHandler", "filename": "/logs/opencanary/opencanary.log" }
      }
    }
  },
  "portscan.enabled": false,
