# Timesketch (Apache-2.0, run unmodified) — Flask configuration, evaluated as Python by the
# upstream application. Every secret and endpoint comes from the container environment, so this
# file holds no credentials. Bloody pushes Plaso timelines here only for very large DFIR
# investigations; its own investigation timeline remains the system of record.
import os


def _env(name, default=None):
    value = os.environ.get(name, default)
    if value is None:
        raise RuntimeError(f"timesketch: environment variable {name} is required")
    return value


SECRET_KEY = _env("TIMESKETCH_SECRET_KEY")
SQLALCHEMY_DATABASE_URI = "postgresql://timesketch:{pw}@{host}:5432/timesketch".format(
    pw=_env("TIMESKETCH_DB_PASSWORD"), host=_env("TIMESKETCH_DB_HOST", "engine-postgres")
)
OPENSEARCH_HOSTS = [{"host": _env("TIMESKETCH_OPENSEARCH_HOST", "engine-opensearch"), "port": 9200}]
OPENSEARCH_USER = None
OPENSEARCH_PASSWORD = None
OPENSEARCH_SSL = False
OPENSEARCH_VERIFY_CERTS = True
OPENSEARCH_TIMEOUT = 30
OPENSEARCH_FLUSH_INTERVAL = 5000

_redis = "redis://:{pw}@{host}:6379/2".format(pw=_env("TIMESKETCH_REDIS_PASSWORD"), host=_env("TIMESKETCH_REDIS_HOST", "engine-valkey"))
CELERY_BROKER_URL = _redis
CELERY_RESULT_BACKEND = _redis

UPLOAD_ENABLED = True
UPLOAD_FOLDER = "/tmp"
DATA_LOCATION = "/usr/share/timesketch/data"

WTF_CSRF_ENABLED = True
WTF_CSRF_TIME_LIMIT = 3600
SESSION_COOKIE_SECURE = _env("TIMESKETCH_COOKIE_SECURE", "false").lower() == "true"
SESSION_COOKIE_HTTPONLY = True
SESSION_COOKIE_SAMESITE = "Lax"

# Sigma, analyzers and external lookups that need commercial API keys stay disabled.
ENABLE_EXPERIMENTAL_UI = False
LLM_PROVIDER_CONFIGS = {}
