#
# Engine-log transport: Bloody ingest API. Merged on top of config.yaml
# (BLOODY_OTEL_ENGINE_LOGS=http; the compose default is `off` — Vector ships engine logs).
#   POST ${BLOODY_INGEST_URL}/<adapter>     e.g. http://api:4000/api/v1/ingest/zeek
#   Authorization: Bearer <API key with event:ingest>   (an org-bound key fixes tenant + organization)
#   Content-Type: application/json — an OTLP/HTTP JSON ExportLogsServiceRequest whose log-record
#   bodies are the raw vendor lines.
# REQUIREMENT: the API's adapter route must unwrap OTLP log envelopes (resourceLogs → scopeLogs →
# logRecords[].body) before handing records to the adapter. Until it does, use Vector (sinks/http.yaml)
# or the Kafka transport (engines-kafka.yaml) for engine logs — see docs/OPERATIONS.md §Data fabric.
# Compression is off: the API does not decode Content-Encoding on requests.
# Retries on 429/5xx honour Retry-After; the persistent queue absorbs API maintenance windows.

exporters:
  otlphttp/bloody_zeek:
    logs_endpoint: "${env:BLOODY_INGEST_URL:-http://api:4000/api/v1/ingest}/zeek?sensorId=${env:HOSTNAME:-otel-collector}"
    encoding: json
    compression: none
    timeout: 30s
    headers:
      Authorization: "Bearer ${env:BLOODY_INGEST_API_KEY:-}"
      User-Agent: bloody-collector/otelcol
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 60s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/queue
      queue_size: 5000
  otlphttp/bloody_suricata:
    logs_endpoint: "${env:BLOODY_INGEST_URL:-http://api:4000/api/v1/ingest}/suricata?sensorId=${env:HOSTNAME:-otel-collector}"
    encoding: json
    compression: none
    timeout: 30s
    headers:
      Authorization: "Bearer ${env:BLOODY_INGEST_API_KEY:-}"
      User-Agent: bloody-collector/otelcol
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 60s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/queue
      queue_size: 5000
  otlphttp/bloody_wazuh:
    logs_endpoint: "${env:BLOODY_INGEST_URL:-http://api:4000/api/v1/ingest}/wazuh?sensorId=${env:HOSTNAME:-otel-collector}"
    encoding: json
    compression: none
    timeout: 30s
    headers:
      Authorization: "Bearer ${env:BLOODY_INGEST_API_KEY:-}"
      User-Agent: bloody-collector/otelcol
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 60s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/queue
      queue_size: 5000

service:
  pipelines:
    logs/zeek:
      receivers: [filelog/zeek]
      processors: [memory_limiter, resource/zeek, batch]
      exporters: [otlphttp/bloody_zeek]
    logs/suricata:
      receivers: [filelog/suricata]
      processors: [memory_limiter, filter/suricata_stats, resource/suricata, batch]
      exporters: [otlphttp/bloody_suricata]
    logs/wazuh:
      receivers: [filelog/wazuh]
      processors: [memory_limiter, resource/wazuh, batch]
      exporters: [otlphttp/bloody_wazuh]
