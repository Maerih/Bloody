{
  "options": {
    "host_identifier": "hostname",
    "schedule_splay_percent": 10,
    "utc": true
  },
  "decorators": {
    "load": [
      "SELECT uuid AS host_uuid FROM system_info;",
      "SELECT hostname AS host_name FROM system_info;"
    ]
  },
  "schedule": {
    "bloody_processes": {
      "query": "SELECT pid, parent, name, path, cmdline, uid, gid, start_time FROM processes;",
      "interval": 300,
      "description": "Running processes (differential: added/removed)"
    },
    "bloody_listening_ports": {
      "query": "SELECT lp.pid, lp.port, lp.protocol, lp.address, p.name, p.path FROM listening_ports lp LEFT JOIN processes p USING (pid);",
      "interval": 600,
      "description": "Listening sockets and owning process"
    },
    "bloody_logged_in_users": {
      "query": "SELECT type, user, tty, host, time, pid FROM logged_in_users;",
      "interval": 300,
      "description": "Interactive sessions"
    },
    "bloody_users": {
      "query": "SELECT uid, gid, username, description, directory, shell FROM users;",
      "interval": 3600,
      "description": "Local accounts (ITDR / ISPM posture)"
    },
    "bloody_crontab": {
      "query": "SELECT event, minute, hour, day_of_month, month, day_of_week, command, path FROM crontab;",
      "interval": 3600,
      "description": "Scheduled tasks (persistence)"
    },
    "bloody_kernel_modules": {
      "query": "SELECT name, size, status, address FROM kernel_modules;",
      "interval": 3600,
      "description": "Loaded kernel modules (rootkit / persistence)"
    },
    "bloody_os_version": {
      "query": "SELECT name, version, major, minor, patch, build, platform, codename FROM os_version;",
      "interval": 86400,
      "snapshot": true,
      "description": "OS inventory (vulnerability correlation)"
    },
    "bloody_deb_packages": {
      "query": "SELECT name, version, arch, source FROM deb_packages;",
      "interval": 86400,
      "snapshot": true,
      "description": "Installed packages (VM module, Debian/Ubuntu)"
    },
    "bloody_rpm_packages": {
      "query": "SELECT name, version, release, arch FROM rpm_packages;",
      "interval": 86400,
      "snapshot": true,
      "description": "Installed packages (VM module, RHEL family)"
    }
  }
}
