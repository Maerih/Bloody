#
# Transport: Bloody ingest API (default).
#   POST ${BLOODY_INGEST_URL}/<adapter>?sensorId=<sensor>[&integrationId=<uuid>]
#        e.g. http://api:4000/api/v1/ingest/zeek — the API's raw-payload route (apps/api ingest
#        routes): the registered adapter normalizes the records into Bloody Canonical Events.
#   Authorization: Bearer <API key with event:ingest>. An organization-bound key fixes tenant and
#   organization server-side; nothing about tenancy is sent in the body.
#   Content-Type: application/x-ndjson — one raw vendor JSON record per line (syslog: text/plain,
#   one raw syslog line per line).
#   BLOODY_INGEST_QUERY (optional) appends query parameters, e.g. "&integrationId=<uuid>" so the
#   integration's last-event timestamp is tracked.
# Compression is OFF: the API does not decode Content-Encoding on requests (a gzip body is
# rejected with 400). TLS to the ingress protects the payload; enable compression only once the
# API accepts compressed requests.
# Retries with backoff on 429/5xx/timeouts; disk buffers absorb API maintenance windows. Ingest is
# idempotent (adapters derive deterministic event ids per tenant), so retried batches do not
# duplicate events.
#
# One sink per adapter (the URL path differs). The blocks are intentionally identical apart from
# `inputs` and `uri`: Vector's config loader does not support YAML merge keys or unknown
# top-level `x-` keys, so there is no anchor here. Keep them in sync.

sinks:
  bloody_api_zeek:
    type: http
    inputs: [zeek]
    uri: "${BLOODY_INGEST_URL:-http://api:4000/api/v1/ingest}/zeek?sensorId=${BLOODY_SENSOR_ID:-vector}${BLOODY_INGEST_QUERY:-}"
    method: post
    compression: none
    auth:
      strategy: bearer
      token: "${BLOODY_INGEST_API_KEY:-}"
    encoding:
      codec: json
      except_fields: ["_bloody"]
    framing:
      method: newline_delimited
    request:
      headers:
        Content-Type: application/x-ndjson
        User-Agent: bloody-collector/vector
      timeout_secs: 30
      retry_attempts: 1000
      retry_initial_backoff_secs: 1
      retry_max_duration_secs: 300
      concurrency: adaptive
    batch:
      max_events: 1000
      max_bytes: 4000000
      timeout_secs: 2
    buffer:
      type: disk
      # Vector minimum for disk buffers (256 MiB) — per sink; raise on busy sensors.
      max_size: 268435488
      when_full: block
    tls:
      verify_certificate: true
      verify_hostname: true
    healthcheck:
      enabled: false

  bloody_api_suricata:
