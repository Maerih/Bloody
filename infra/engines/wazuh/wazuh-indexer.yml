#
# Wazuh indexer (OpenSearch distribution, run unmodified) — single-node development settings.
# Bloody does not query this indexer directly: it consumes Wazuh through the manager REST API
# (:55000) and the alerts.json stream (Vector / OTel → Bloody ingest). The indexer is kept so
# the Wazuh stack stays upstream-supported (vulnerability detection state, archives).
cluster.name: bloody-wazuh
node.name: wazuh.indexer
network.host: 0.0.0.0
http.port: 9200
discovery.type: single-node
path.data: /var/lib/wazuh-indexer
path.logs: /var/log/wazuh-indexer
compatibility.override_main_response_version: true

# TLS everywhere (certificates from the wazuh-certs one-shot service, mounted read-only).
plugins.security.ssl.http.enabled: true
plugins.security.ssl.http.pemcert_filepath: certs/wazuh.indexer.pem
plugins.security.ssl.http.pemkey_filepath: certs/wazuh.indexer-key.pem
plugins.security.ssl.http.pemtrustedcas_filepath: certs/root-ca.pem
plugins.security.ssl.transport.pemcert_filepath: certs/wazuh.indexer.pem
plugins.security.ssl.transport.pemkey_filepath: certs/wazuh.indexer-key.pem
plugins.security.ssl.transport.pemtrustedcas_filepath: certs/root-ca.pem
plugins.security.ssl.transport.enforce_hostname_verification: false
plugins.security.ssl.transport.resolve_hostname: false

# Subjects issued by wazuh-certs-generator.
plugins.security.authcz.admin_dn:
  - "CN=admin,OU=Wazuh,O=Wazuh,L=California,C=US"
plugins.security.nodes_dn:
  - "CN=wazuh.indexer,OU=Wazuh,O=Wazuh,L=California,C=US"
plugins.security.allow_default_init_securityindex: true
plugins.security.check_snapshot_restore_write_privileges: true
plugins.security.enable_snapshot_restore_privilege: true
plugins.security.restapi.roles_enabled:
  - all_access
  - security_rest_api_access
plugins.security.system_indices.enabled: true
