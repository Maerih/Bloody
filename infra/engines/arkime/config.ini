# Arkime (Apache-2.0, run unmodified) — development configuration.
# Mode: offline PCAP ingestion. arkime-capture watches /data/pcap-drop for new .pcap/.pcapng files
# (evidence uploads, Suricata/Zeek extracted captures, tcpdump from a sensor) and indexes sessions
# into the engine OpenSearch; Bloody queries the viewer API for session search and PCAP retrieval
# (DFIR evidence, NDR pivots). Live capture runs on dedicated sensor hosts (host networking,
# interface=…), not in this compose stack.
# Secrets are NOT stored here: ARKIME__passwordSecret / ARKIME__serverSecret come from the environment.
[default]
elasticsearch=http://engine-opensearch:9200
rotateIndex=daily
prefix=arkime_
pcapDir=/data/pcap
maxFileSizeG=2
maxFileTimeM=60
freeSpaceG=5%
viewPort=8005
viewHost=0.0.0.0
httpRealm=Arkime
authMode=digest
tcpTimeout=600
tcpSaveTimeout=720
udpTimeout=30
icmpTimeout=10
maxStreams=1000000
maxPackets=10000
packetThreads=2
pcapWriteMethod=simple
pcapWriteSize=262144
dbBulkSize=300000
compressES=false
spiDataMaxIndices=7
pluginsDir=/opt/arkime/plugins
parsersDir=/opt/arkime/parsers
# No external GeoIP/ASN downloads (MaxMind requires a licence key): enrichment happens in Bloody.
geoLite2Country=
geoLite2ASN=
rirFile=
ouiFile=
offlineFilenameRegex=(?i)\.(pcap|pcapng|cap)$
