# Bloody web tier — nginx main configuration (unprivileged, read-only-rootfs friendly:
# every writable path lives under /tmp).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  client_body_timeout 30s;
  client_header_timeout 15s;
  send_timeout 60s;
  large_client_header_buffers 4 16k;

  # Structured access log (no query strings: they may carry search terms / identifiers).
  log_format bloody_json escape=json
    '{"ts":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr",'
    '"xff":"$http_x_forwarded_for","method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"duration_s":$request_time,"upstream_s":"$upstream_response_time",'
    '"user_agent":"$http_user_agent"}';
  access_log /dev/stdout bloody_json;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Preserve the original scheme when TLS terminates at the ingress / load balancer.
  map $http_x_forwarded_proto $bloody_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }
  map $http_upgrade $bloody_connection_upgrade {
    default upgrade;
    ""      close;
  }
  # Reuse an incoming request id (from the ingress) or mint one, and pass it to the API.
  map $http_x_request_id $bloody_request_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  include /etc/nginx/conf.d/*.conf;
}
